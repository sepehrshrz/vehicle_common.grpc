syntax = "proto3";

package device;

option go_package = "github.com/sepehrshrz/vehicle_common.grpc/genproto/shared_d_command_v1;shared_d_command_v1";

import "shared_d_common_v1.proto";
import "shared_d_config_v1.proto";
import "shared_d_gps_v1.proto";
import "shared_d_vehicle_v1.proto";
import "shared_d_telemetry_v1.proto";
import "shared_d_history_v1.proto";

enum CommandStatus {
  CMD_UNSPECIFIED = 0;
  CMD_ACCEPTED    = 1;   // long job queued (FOTA)
  CMD_OK          = 2;
  CMD_FAILED      = 3;
  CMD_UNSUPPORTED = 4;
  CMD_EXPIRED     = 5;
  CMD_BUSY        = 6;
}

enum CommandType {
  CMD_TYPE_UNSPECIFIED = 0;
  CMD_ECHO       = 1;
  CMD_REBOOT     = 2;
  CMD_FOTA       = 3;
  CMD_GET_CONFIG = 4;
  CMD_ENGINE     = 5;  // EngineParams.on: true=engine on, false=engine off
  CMD_SET_CONFIG = 6;  // SetConfigParams: patch blocks; omit = unchanged
  CMD_GPS_RECOVER = 7; // GpsRecoverParams: cold start / HW reset / full cold
  CMD_SET_NW_MODE = 8; // NwModeParams: AUTO / GSM_2G / LTE_4G
}

message EchoParams {
  string message = 1;
}

message RebootParams {
  uint32 delay_ms = 1;
}

message FotaParams {
  string package_url    = 1;
  string target_version = 2;
  bool   force          = 3;
  bytes  sha256         = 4;  // exactly 32 bytes; required
}

// Which blocks to return. All false => return every known block.
message GetConfigParams {
  bool network   = 1;
  bool sms       = 2;
  bool gps       = 3;
  bool logging   = 4;
  bool vehicle   = 5;
  bool telemetry = 6;
  bool ussd_codes = 7;
  bool status_history = 8;
}

message EngineParams {
  bool on = 1;  // true = engine on, false = engine off
}

enum GpsRecoverAction {
  GPS_RECOVER_UNSPECIFIED = 0;
  GPS_RECOVER_COLD_START  = 1;  // $PAIR006
  GPS_RECOVER_HW_RESET    = 2;  // RESET_N pulse
  GPS_RECOVER_FULL_COLD   = 3;  // $PAIR007 — clears config; rare
}

message GpsRecoverParams {
  GpsRecoverAction action = 1;
}

enum NwMode {
  NW_MODE_UNSPECIFIED = 0;
  NW_MODE_AUTO        = 1;  // LTE preferred
  NW_MODE_GSM_2G      = 2;
  NW_MODE_LTE_4G      = 3;
}

message NwModeParams {
  NwMode mode = 1;
}

// Patch settings via command. Same blocks as DeviceConfigurationUpdate (omit = unchanged).
// Field numbers are Update blocks 2–8 renumbered to 1–7 (no header / proto_version here).
message SetConfigParams {
  NetworkConfig         network   = 1;
  SmsNotificationConfig sms       = 2;
  GpsConfig             gps       = 3;
  LoggingConfig         logging   = 4;
  VehicleConfig         vehicle   = 5;
  TelemetryConfig       telemetry = 6;
  UssdBalanceConfig     ussd_codes = 7;
  StatusHistoryConfig   status_history = 8;
}

// MQTT root for device/{id}/command
message DeviceCommand {
  CommandHeader header = 1;
  CommandType   type   = 2;
  // Serialized EchoParams | RebootParams | FotaParams | GetConfigParams |
  // EngineParams | SetConfigParams | GpsRecoverParams | NwModeParams
  bytes         params = 3;
  ProtoVersion proto_version = 100;
}

// MQTT root for ingest/telemetry/ack
message FotaAckState {
  // Running (or about-to-run) firmware identity string, same shape as DeviceIdentity.fw_version.
  string fw_version = 1;
}

// Per-command snapshot carried in CommandResponse.previous / .applied.
message CommandState {
  optional DeviceConfiguration config  = 1;  // SET_CONFIG / GET_CONFIG
  optional EngineParams        engine  = 2;  // CMD_ENGINE
  optional string              echo    = 3;  // CMD_ECHO
  optional FotaAckState        fota    = 4;  // CMD_FOTA
  optional NwModeParams        nw_mode = 5;  // CMD_SET_NW_MODE
}

message CommandResponse {
  CommandHeader header     = 1;
  CommandStatus status     = 2;
  uint32        error_code = 3;
  string        message    = 4;
  oneof result {
    DeviceConfiguration config = 10;  // GET_CONFIG (kept for compatibility)
  }
  optional CommandState previous = 11;
  optional CommandState applied  = 12;
  ProtoVersion proto_version = 100;
}
