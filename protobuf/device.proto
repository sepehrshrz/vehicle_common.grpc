syntax = "proto3";

package device;

option go_package = "github.com/sepehrshrz/vehicle_common.grpc/genproto/device;device";


service DeviceService {
  rpc DeviceByIMEI (GetDeviceByIMEIReq) returns (GetDeviceByIMEIRes) {}
  rpc CommandByID (GetCommandByIDReq) returns (GetDeviceByIMEIRes) {}
}


message GetDeviceByIMEIReq {
  string device_imei = 1;
}

message GetDeviceByIMEIRes {
  string id = 1;
  string imei = 2;
  string mac  = 3;
  string sim_num  = 4;
  string barcode = 5;
  int64 vehicle_id = 6;
  int64 device_model_id = 7 ;
  bool is_active = 8 ;
  string activated_at= 9;
  string created_at= 10;
  string updated_at= 11;
}


message GetCommandByIDReq {
  string command_id = 1;
}

message GetCommandByIDRes {
  int64 id = 1;
  int64 command_type = 2;
  int64 status  = 3;
  int64 device_id  = 4;
  int64 vehicle_id  = 5;
  string payload = 6;
  string failed_description  = 7;
  string expire_at= 8;
  string created_at= 9;
  string updated_at= 10;
}